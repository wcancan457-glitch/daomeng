services:
  - type: web
    name: daomeng-api
    runtime: docker
    rootDir: daomeng/daomeng/backend
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: LOG_LEVEL
        value: INFO
      - key: AUTH_REQUIRED
        value: "true"
      - key: AUTH_MODE
        value: users
      - key: REGISTRATION_ENABLED
        value: "true"
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: SETTINGS_ENCRYPTION_KEY
        generateValue: true
      - key: AUTH_ACCESS_TOKEN_TTL_SECONDS
        value: "900"
      - key: AUTH_REFRESH_TOKEN_TTL_SECONDS
        value: "2592000"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: ADMIN_EMAIL
        value: admin@daomeng.app
      - key: DATABASE_URL
        fromDatabase:
          name: daomeng-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://daomeng.vercel.app
      - key: AUTH_TOKEN_TTL_SECONDS
        value: "86400"
      - key: API_RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: AUTH_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: MAX_UPLOAD_BYTES
        value: "26214400"
      - key: MAX_USER_TEMP_BYTES
        value: "262144000"
      - key: SILICONFLOW_API_KEY
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: ARK_API_KEY
        sync: false
      - key: KLING_ACCESS_KEY
        sync: false
      - key: KLING_SECRET_KEY
        sync: false

databases:
  - name: daomeng-db
    plan: free
    ipAllowList: []
