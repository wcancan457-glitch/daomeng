name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daomeng/daomeng/backend
    env:
      AUTH_MODE: users
      AUTH_TOKEN_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      DATABASE_URL: sqlite:///./ci.db
      PIPELINE_WORKER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --extra dev --frozen
      - run: uv run alembic upgrade head
      - run: uv run ruff check accounts api core migrations pipelines tests --ignore E402,E701
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daomeng/daomeng/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: daomeng/daomeng/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
